<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Icon Concepts — Cardinal Solutions</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f12; --card: #171b1f; --line: rgba(160,170,175,0.16);
    --text: #ece8e0; --text-faint: #5c5a55; --blue: #7fa3b3; --blue-dim: #4d6b78; --redline: #a8432f; --gold: #b08d57;
    --display: 'Space Grotesk', sans-serif; --mono: 'JetBrains Mono', monospace;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: var(--display); margin: 0; padding: 60px 32px; }
  h1 { font-size: 22px; font-weight: 500; margin-bottom: 8px; }
  p.sub { font-family: var(--mono); font-size: 12px; color: var(--text-faint); margin-bottom: 48px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; max-width: 900px; }
  .card { background: var(--card); border: 1px solid var(--line); padding: 36px 24px; text-align: center; }
  .card svg { width: 56px; height: 56px; }
  .card h3 { font-size: 15px; font-weight: 500; margin: 20px 0 6px; }
  .card p { font-family: var(--mono); font-size: 11px; color: var(--text-faint); margin: 0; }
</style>
</head>
<body>
<h1>Icon Concepts</h1>
<p class="sub">Candidate line-art icons \u2014 same stroke weight and palette as the hero schematic / compass mark.</p>
<div class="grid">

  <div class="card">
    <svg viewBox="0 0 64 64" fill="none">
      <circle cx="32" cy="14" r="5" stroke="var(--blue)" stroke-width="1.6"/>
      <path d="M28 18 L14 52 M36 18 L50 52" stroke="var(--blue)" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M20 40 L44 40" stroke="var(--redline)" stroke-width="1.4"/>
      <circle cx="14" cy="54" r="2" fill="var(--blue)"/>
      <circle cx="50" cy="54" r="2" fill="var(--blue)"/>
    </svg>
    <h3>Build</h3>
    <p>Drafting compass</p>
  </div>

  <div class="card">
    <svg viewBox="0 0 64 64" fill="none">
      <path d="M10 48 L10 38 L22 38 L22 28 L34 28 L34 16 L46 16" stroke="var(--blue)" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M40 16 L46 16 L46 22" stroke="var(--redline)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M10 52 L54 52" stroke="var(--blue-dim)" stroke-width="1" opacity="0.5"/>
    </svg>
    <h3>Grow</h3>
    <p>Ascending stages</p>
  </div>

  <div class="card">
    <svg viewBox="0 0 64 64" fill="none">
      <path d="M32 10 L50 16 V30 C50 42 42 50 32 54 C22 50 14 42 14 30 V16 Z" stroke="var(--blue)" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M24 30 L29 36 L41 22" stroke="var(--redline)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h3>Sustain</h3>
    <p>Shield &amp; check</p>
  </div>

  <div class="card">
    <svg viewBox="0 0 64 64" fill="none">
      <rect x="16" y="10" width="26" height="34" rx="1" stroke="var(--blue)" stroke-width="1.5"/>
      <rect x="22" y="18" width="26" height="34" rx="1" stroke="var(--blue-dim)" stroke-width="1.5" fill="var(--bg)"/>
      <path d="M28 26 H42 M28 32 H42 M28 38 H36" stroke="var(--text-faint)" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M40 44 L44 48 L50 40" stroke="var(--redline)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h3>Documentation</h3>
    <p>SOPs &amp; records</p>
  </div>

  <div class="card">
    <svg viewBox="0 0 64 64" fill="none">
      <path d="M14 20 H40 M14 28 H40 M14 36 H32" stroke="var(--blue-dim)" stroke-width="1.4" stroke-linecap="round"/>
      <circle cx="40" cy="38" r="10" stroke="var(--blue)" stroke-width="1.6"/>
      <path d="M47 45 L54 52" stroke="var(--blue)" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
    <h3>Inspection</h3>
    <p>Quality review</p>
  </div>

  <div class="card">
    <svg viewBox="0 0 64 64" fill="none">
      <circle cx="32" cy="26" r="14" stroke="var(--redline)" stroke-width="1.6"/>
      <path d="M26 26 L30 31 L39 20" stroke="var(--redline)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M24 38 L18 54 L32 48 L46 54 L40 38" stroke="var(--gold)" stroke-width="1.5" stroke-linejoin="round"/>
    </svg>
    <h3>Credentials</h3>
    <p>Verified seal</p>
  </div>

</div>
</body>
</html>
